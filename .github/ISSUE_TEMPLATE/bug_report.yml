name: Bug report
description: Something in Crucible does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Not for security vulnerabilities — those go through
        [private reporting](https://github.com/Mootikins/crucible/security/advisories/new).
        See [SECURITY.md](../blob/master/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cru --version`. Say "built from source" plus the commit if so.
      placeholder: "cru 0.22.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Fedora 43 / macOS 15.3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / TUI
        - Daemon / sessions
        - Web UI
        - Lua / Fennel plugins
        - ACP delegation (Claude Code, OpenCode, Gemini CLI)
        - MCP server
        - Parser / kiln indexing
        - Not sure
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands. If config matters, include the relevant part of `~/.config/crucible/config.toml` (or the project's `crucible.toml`).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant output from `cru daemon status`, or a run with `-v`. Redact API keys
        and any private note content before pasting.
      render: text
