name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Create web asset placeholder
        run: mkdir -p crates/crucible-web/web/dist && echo "<html></html>" > crates/crucible-web/web/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --lib --bins --tests -- -W warnings
      - name: Check for god files
        run: scripts/check-file-sizes.sh

  deny:
    name: Dependency Licences
    runs-on: ubuntu-latest
    # This is the one job here that hands the checkout to a third-party
    # container action, so it gets least privilege explicitly: read-only, and
    # no git credentials left behind in the workspace for that container to
    # find. Neither checkout nor cargo-deny performs an authenticated push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Runs `cargo-deny --all-features check licenses`, matching
      # `just license-check` exactly — the two have to stay in step or the gate
      # only ever runs on whichever side you remembered.
      #
      # `licenses` and nothing else: deny.toml states a policy for that check
      # alone. The action's default of `check` (all checks) would additionally
      # enforce `advisories`, `bans` and `sources` against cargo-deny's built-in
      # defaults rather than anything this repo has decided — turning an
      # upstream advisory published overnight into a red build on a branch that
      # changed nothing.
      #
      # `--all-features` is deliberately broader than the release binary's
      # `fastembed,web`: it means a licence cannot enter through a feature that
      # is off today and on in a later release.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check
          command-arguments: licenses

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Create web asset placeholder
        run: mkdir -p crates/crucible-web/web/dist && echo "<html></html>" > crates/crucible-web/web/dist/index.html
      - name: Build mock ACP agent for smoke tests
        run: cargo build -p crucible-daemon --features test-utils --bin mock-acp-agent
      - name: Run tests with nextest
        run: cargo nextest run --profile ci --workspace
        # Push the proptest case budget above the local 64-case floor so
        # heavyweight proofs get more coverage in CI than on a dev box.
        # Per-file `.max(N)` floors in crucible-oil/tests still apply.
        env:
          CRUCIBLE_PROPTEST_CASES: "256"
      # Oil's serde JSON contract (consumed by the web UI) and its proptests
      # are feature-gated off the default build — run them explicitly.
      - name: Run oil feature-gated tests (serde contract + proptests)
        run: cargo nextest run --profile ci -p crucible-oil --features serde,test-utils
        env:
          CRUCIBLE_PROPTEST_CASES: "256"
      - name: Verify Lua stubs are not stale
        run: cargo nextest run --profile ci -p crucible-lua -E 'test(stubs)' --no-capture
        env:
          CRUCIBLE_PROPTEST_CASES: "256"
      # nextest does not execute doctests, so every example in a doc comment
      # was unverified until this step existed — they had rotted to 62 failures.
      - name: Run doctests
        run: cargo test --workspace --doc

  test-sqlite:
    name: Test SQLite Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Create web asset placeholder
        run: mkdir -p crates/crucible-web/web/dist && echo "<html></html>" > crates/crucible-web/web/dist/index.html
      - name: Build cru binary for e2e tests
        run: cargo build -p crucible-cli --bin cru
      - name: Build mock ACP agent for smoke tests
        run: cargo build -p crucible-daemon --features test-utils --bin mock-acp-agent
      - name: Run SQLite-backed tests (merged into crucible-daemon)
        run: cargo nextest run -p crucible-daemon -E 'test(sqlite)'
        env:
          CRUCIBLE_PROPTEST_CASES: "256"

  test-web-unit:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/crucible-web/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Vitest unit tests
        run: bunx vitest run

  test-web:
    # Sharded across jobs rather than parallelised inside one: every worker
    # shares a single Vite dev server, so raising the worker count contends on
    # that one process. Separate jobs get a server each. Requires
    # `fullyParallel: true` (set in playwright.config.ts) — without it
    # Playwright shards whole FILES, and one shard lands 20 tests while another
    # gets 1.
    name: Web E2E Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: crates/crucible-web/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright E2E tests (default + stories projects)
        run: bunx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
      - name: Upload blob report
        # Needed on failure too — merge-reports builds the combined HTML that
        # says WHICH shard failed and why.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: crates/crucible-web/web/blob-report/
          retention-days: 7
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: crates/crucible-web/web/test-results/
          retention-days: 7

  test-web-report:
    name: Web E2E Report
    # Runs even when a shard fails — a merged report of a red run is the
    # point.
    if: ${{ !cancelled() }}
    needs: [test-web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/crucible-web/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: crates/crucible-web/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: crates/crucible-web/web/playwright-report/
          retention-days: 7

  test-count-gate:
    # Regression gate for the runnable-case count of each suite. GitHub CI
    # invokes cargo/vitest/playwright DIRECTLY (not `just ci`), so this job
    # mirrors the `just test-count` recipe — both must stay in step or the
    # gate only ever runs on whichever side you remembered (same trap as the
    # `deny` job above). Fails if any suite grows beyond +2% (rounded down)
    # of the baseline in crates/test-count-baseline.json.
    name: Test Count Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: crates/crucible-web/web
      # crucible-web embeds dist/index.html via rust-embed at compile time,
      # so `cargo nextest list --workspace` (which compiles every crate)
      # needs the placeholder or the build breaks.
      - name: Create web asset placeholder
        run: mkdir -p crates/crucible-web/web/dist && echo "<html></html>" > crates/crucible-web/web/dist/index.html
      - name: Compare test counts to baseline (+2% cap)
        run: |
          set -euo pipefail
          baseline="crates/test-count-baseline.json"

          # nextest JSON has a top-level ."test-count" field. --all-features
          # pulls in the feature-gated property tests the default build skips.
          rust=$(cargo nextest list --message-format json --workspace --all-features 2>/dev/null \
              | jq -er '."test-count"')

          # vitest 4.x `list --json` emits a JSON array of runnable cases.
          # NEVER pass a filename: `vitest list --json <file>` OVERWRITES that
          # file with a reporter blob and clobbers source.
          web_unit=$(cd crates/crucible-web/web && bunx vitest list --json 2>/dev/null \
              | jq -er 'length')

          # Playwright `--list` prints one line per case as
          #   "  [chromium|stories] › <file>:<line>:<col> › <title>"
          # Scoped to the two project names declared in playwright.config.ts
          # so the "Listing tests:" header and "Total:" footer don't inflate it.
          playwright=$(cd crates/crucible-web/web \
              && bunx playwright test --list 2>&1 \
              | grep -cE '^\s+\[(chromium|stories)\] ›')

          fail=0
          check() {
              local name="$1" got="$2" base="$3"
              # +2% rounded down: floor(baseline*0.02) + baseline.
              local cap=$(( base + base * 2 / 100 ))
              printf '%-12s got=%-6s baseline=%-6s cap=%-6s' "$name" "$got" "$base" "$cap"
              if [ "$got" -gt "$cap" ]; then
                  printf '  FAIL (+%d over baseline, cap +%d)\n' \
                      "$(( got - base ))" "$(( cap - base ))"
                  fail=1
              else
                  printf '  ok\n'
              fi
          }

          check rust       "$rust"       "$(jq -er .rust       < "$baseline")"
          check web_unit   "$web_unit"   "$(jq -er .web_unit   < "$baseline")"
          check playwright "$playwright" "$(jq -er .playwright < "$baseline")"

          if [ "$fail" -ne 0 ]; then
              echo
              echo "test-count gate FAILED: a suite grew beyond its +2% cap."
              echo "If this is a deliberate baseline bump, edit $baseline and put"
              echo "a >=1-sentence justification in the bumping commit body."
              exit 1
          fi
          echo "test-count gate passed."
