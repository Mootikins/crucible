name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # Overrides the justfile's dev-box defaults for a 4-core / 16GB runner and for
  # the higher property-test budget CI is expected to carry.
  CARGO_BUILD_JOBS: "4"
  CRUCIBLE_PROPTEST_CASES: "256"

# Jobs invoke `just` so the recipe and the CI step cannot become two
# hand-maintained copies. Exceptions: `build-from-clean-clone` (provisioned with
# nothing, on purpose), `deny` (runs through cargo-deny-action) and the sharded
# Playwright jobs (their `--shard`/`--reporter` flags are CI-only).

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-prereqs
      - run: just lint fmt
      - run: just lint clippy
      - name: Check for god files
        run: just lint size

  # Validate the `docs/` kiln: every note parses, frontmatter is complete, every
  # wikilink resolves, every `crates/…` code reference names a file that exists
  # (and, where the reference carries a `:line` anchor, a line that is within
  # that file), and every TOML block in the docs survives the config loader.
  #
  # Not filtered to `paths: docs/**`: the code-reference check fails on a Rust
  # rename that touches no doc, and a skipped job deadlocks a required check.
  docs:
    name: Docs Kiln Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-prereqs
      - run: just lint docs

  # The install path a new user actually takes: clone, cargo build, no bun and so
  # no web/dist. The absence of a bun step is the thing under test.
  build-from-clean-clone:
    name: Build without a frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Fail if web/dist is present
        run: |
          if [ -e crates/crucible-web/web/dist ]; then
            echo "web/dist exists in a fresh checkout; this job no longer tests anything" >&2
            exit 1
          fi
      - run: cargo build -p crucible-cli

  deny:
    name: Dependency Licences
    runs-on: ubuntu-latest
    # Least privilege: this job hands the checkout to a third-party container
    # action, and neither it nor checkout performs an authenticated push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mirrors `just lint license`. `licenses` and nothing else: deny.toml
      # states a policy for that check alone, and the action's default (all
      # checks) would turn an overnight upstream advisory into a red build.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check
          command-arguments: licenses

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-prereqs
      - name: Run tests with nextest
        run: just test ci
      # Oil's serde JSON contract (consumed by the web UI) and the Lua
      # stub-staleness check — feature-gated off the default build, so
      # `test ci` never compiles them.
      - name: Run feature-gated suites
        run: just test features
      # nextest does not execute doctests, so every example in a doc comment
      # was unverified until this step existed — they had rotted to 62 failures.
      - name: Run doctests
        run: just test doc

  test-plugins:
    name: Lua Plugin Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-prereqs
      - run: just test plugins

  test-web-unit:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/crucible-web/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `just` finds the justfile by searching upward and runs recipes from the
      # repo root, so the recipes work unchanged from this job's directory.
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: just lint types
      - name: Run Vitest unit tests
        run: just web-test unit

  test-web-live:
    # Its own job, not a step in `test-web`: this tier needs a Rust toolchain
    # and a `cru` build, and the sharded matrix would pay that four times.
    #
    # This is the only job that sees real HTTP responses from `cru web` — CSP,
    # nosniff, Content-Disposition, host validation, file serving. `test-web`
    # runs against the Vite dev server, which sends none of those headers, so
    # without this job every one of those controls could regress green.
    name: Web Live Tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-prereqs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: crates/crucible-web/web
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: crates/crucible-web/web
      # Builds `cru` and `web/dist` itself — see the recipe's comment on why it
      # must not be allowed to skip.
      - run: just web-test live
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-live
          path: crates/crucible-web/web/test-results/
          retention-days: 7

  test-web:
    # Sharded across jobs rather than parallelised inside one: workers share a
    # single Vite dev server, so separate jobs get a server each. Requires
    # `fullyParallel: true`, else Playwright shards whole FILES and one shard
    # lands 20 tests while another gets 1.
    name: Web E2E Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: crates/crucible-web/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright E2E tests (default + stories projects)
        run: bunx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
      - name: Upload blob report
        # Needed on failure too — merge-reports builds the combined HTML that
        # says WHICH shard failed and why.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: crates/crucible-web/web/blob-report/
          retention-days: 7
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: crates/crucible-web/web/test-results/
          retention-days: 7

  test-web-report:
    name: Web E2E Report
    # Runs even when a shard fails — a merged report of a red run is the
    # point.
    if: ${{ !cancelled() }}
    needs: [test-web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/crucible-web/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: crates/crucible-web/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: crates/crucible-web/web/playwright-report/
          retention-days: 7
