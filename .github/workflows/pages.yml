name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/Help/**'
      - 'docs/Guides/**'
      # Canvases are published wherever they sit under `docs/` except `Meta/`
      # (see `docs-site/src/lib/canvas-pages.mjs`), so the two note directories
      # above do not cover them — `docs/Canvas Tour.canvas` sits at the root.
      - 'docs/**.canvas'
      - 'docs-site/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: docs-site

      # Starlight fails the build on the FIRST stale slug, so a deleted note
      # costs a red deploy and names one line. This names every one at once,
      # before the build.
      - name: Check sidebar slugs
        run: bun run check:sidebar
        working-directory: docs-site

      - name: Build site
        run: bun run build
        working-directory: docs-site

      # A build that succeeds proves nothing about whether its links work:
      # 240 in-content cross-references once 404'd through a green build.
      - name: Check internal links
        run: bun run check:links
        working-directory: docs-site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
