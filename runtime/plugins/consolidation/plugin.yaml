name: consolidation
version: "0.1.0"
description: Periodic pass over recent sessions that proposes pattern notes
author: Crucible Team
license: MIT

main: init.luau

capabilities:
  - kiln
  - agent
  - config
  - filesystem

config:
  properties:
    enabled:
      type: boolean
      description: Master switch. A pass spends model calls unattended, so it is off until a user turns it on.
      default: false
    kiln:
      type: string
      description: Name of the kiln the pass reads and stages proposals in
    model:
      type: string
      description: Auxiliary model for the consolidation reviewer (keep it cheap)
    provider:
      type: string
      description: "Optional provider override (e.g. anthropic, openai)"
    interval:
      type: number
      description: Seconds between passes
      default: 21600
    max_problem:
      type: number
      description: Most sessions with tool errors or rejected edits per pass
      default: 5
    max_clean:
      type: number
      description: Most clean sessions per pass
      default: 3
    min_turns:
      type: number
      description: Fewest user turns a session needs before the pass reads it
      default: 2
    session_chars:
      type: number
      description: Transcript cap per session
      default: 15000
    timeout:
      type: number
      description: Seconds to wait for the consolidation reviewer
      default: 240
    max_iterations:
      type: number
      description: Upper bound on the reviewer's tool-loop turns
      default: 12
    rejection_memory:
      type: number
      description: How many recent rejections the reviewer is told about
      default: 20

exports:
  auto_discover: true
