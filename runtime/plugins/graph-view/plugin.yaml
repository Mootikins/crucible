name: graph-view
version: "0.2.0"
description: Inspect a kiln's link graph, in Fennel
author: Crucible Team
license: MIT

# `kiln` for cru.kiln.*, `ui` for the (declared, not yet rendered) view,
# `config` because `setup(cfg)` reads `[plugins.graph-view] max_depth`.
capabilities:
  - kiln
  - ui
  - config

main: init.fnl

dependencies: []

# Configuration lives in the user's config.toml under `[plugins.graph-view]`;
# the daemon hands that section to the plugin's `setup(cfg)` at load time.
# plugin.yaml has no config schema — a `config:` block here is ignored.

exports:
  views:
    - graph
  commands:
    - /graph
  tools:
    - graph_links
    - graph_stats
  auto_discover: false
