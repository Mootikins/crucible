name: retrieval-lab
version: "0.1.0"
description: "A proof of concept. It exercises the search:rerank and index:blocks stages, the cru.vec bindings and the block trajectory idea. It ships off, and no strategy here is a recommended retrieval setting."
author: Crucible Team
license: MIT

main: init.luau

capabilities:
  - kiln
  - config

config:
  properties:
    enabled:
      type: boolean
      description: Register the search:rerank and index:blocks handlers. Off means the plain block scan.
      default: false
    strategy:
      type: string
      description: "One of points, arc_post, arc_pre, bezier_post, meta_pre, ppr_post, meta_ppr, slate_post"
      default: points
    pair_cosine_min:
      type: number
      description: Two adjacent blocks form a pair only when their cosine reaches this value
      default: 0.5
    curve_window:
      type: number
      description: How many consecutive blocks the bezier_post curve passes through
      default: 3
    curve_samples:
      type: number
      description: How many points of the curve bezier_post scores
      default: 8
    exclude_kinds:
      type: array
      items:
        type: string
      description: Block kinds a strategy never pairs with or walks through. Every embedded content block of any other kind joins a pair.
      default: ["heading", "transition"]
    meta_format:
      type: string
      description: "The text meta_pre embeds. {meta} is the title, the nearest heading and the description; {text} is the block's own text."
      default: "{meta}\n\n{text}"
    ppr_damping:
      type: number
      description: The share of a PageRank round that follows a link rather than teleports
      default: 0.5
    ppr_blend:
      type: number
      description: How much of a note's PageRank, scaled so the best is one, joins each hit's score
      default: 0.1
    ppr_extra:
      type: number
      description: How many notes the walk reached and the scan did not enter the list
      default: 3
    slate:
      type: array
      items:
        type: object
      description: "slate_post: the quota plan, in order; each entry is { type = point | arc | hop, n }. The rest of the list follows by point score."
      default: [{ type: point, n: 2 }, { type: arc, n: 2 }, { type: hop, n: 2 }]
    hop_from:
      type: number
      description: "slate_post: how many top dense notes the hop slot expands by one link"
      default: 2

exports:
  auto_discover: true
