name: reflection
version: "0.1.0"
description: Retrospective self-improvement — propose kiln notes after a session ends
author: Crucible Team
license: MIT

main: init.luau

capabilities:
  - kiln
  - agent
  - config
  - filesystem

config:
  properties:
    enabled:
      type: boolean
      description: Master switch for the reflection pass
      default: true
    model:
      type: string
      description: "Auxiliary model the reflection subagent runs on (keep it cheap)"
    provider:
      type: string
      description: "Optional provider override (e.g. anthropic, openai)"
    min_turns:
      type: number
      description: Minimum user turns before a session is worth reflecting on
      default: 3
    max_proposals:
      type: number
      description: Maximum proposals to stage per session
      default: 5
    timeout:
      type: number
      description: Seconds to wait for the reflection subagent
      default: 120
    max_iterations:
      type: number
      description: Upper bound on the reviewer's tool-loop turns
      default: 12
    rejection_memory:
      type: number
      description: How many recent rejections the reviewer is told about
      default: 20
    tool_result_chars:
      type: number
      description: Characters kept from each tool result in the transcript
      default: 2000
    transcript_chars:
      type: number
      description: Characters kept from the whole transcript, cut from the front
      default: 60000

exports:
  auto_discover: true
