name: discord
version: "0.2.0"
description: Discord integration via Gateway WebSocket and REST API
author: Crucible Team
license: MIT

main: init.lua

capabilities:
  - config
  - network
  - websocket
  - agent

config:
  properties:
    bot_token:
      type: string
      description: Discord bot token (from https://discord.com/developers)
      default: ""
    intents:
      type: number
      description: Gateway intents bitmask (default 37889 = GUILDS | GUILD_MESSAGES | DIRECT_MESSAGES | MESSAGE_CONTENT)
      default: 37889
    auto_connect:
      type: boolean
      description: Automatically connect to gateway on plugin load
      default: false
    command_prefix:
      type: string
      description: Prefix for text commands (empty = slash commands only)
      default: ""
    respond_to:
      type: string
      description: When to respond to messages
      default: "mentions"
      enum: ["mentions", "prefix", "both", "all"]
    access:
      type: object
      description: >-
        Access tier per identity, keyed "user:<id>", "role:<id>" (a guild role
        the sender holds) or "guild:<id>", with an optional "default". Values
        are "read", "ask" or "write"; unset means read. Precedence is
        user: > role: > guild: > default, first match wins — a grant aimed at
        the account beats one aimed at a role it holds, which beats the room's.
        Sessions are keyed per sender, so a grant reaches only the person it
        names. Roles are read from the message's guild membership: a DM carries
        none, so role: keys never apply there, and when a member holds two
        granting roles the first in their own role list wins.
        "ask" prompts before each write; see approvers for who answers.
      default: {}
    approvers:
      type: array
      description: >-
        User ids that answer "ask" prompts, in order — the first is DMed the
        prompt and only their reply resolves it, so the request may come from
        any channel. Empty (the default) means the requester answers their own
        prompt, which is offered only when their tier came from a "user:" or
        "role:" key: a "guild:" or default grant names a room, not a person.
        Put your own id here for a personal bot; you are then both parties.
        Only one prompt may be outstanding per channel — a reply names no
        request, so a second one arriving unanswered is denied.
      default: []
    tool_policy:
      type: object
      description: >-
        Tool name to "allow"/"ask"/"deny". Set this to replace the access tiers
        wholesale — the escape hatch for granting a tool the tiers withhold,
        such as bash on a personal bot.
      default: {}
    allowed_users:
      type: array
      description: >-
        User IDs the bot will answer in DMs. Empty (the default) means nobody —
        a DM from anyone else is ignored. respond_to does not apply to DMs.
      default: []
    allowed_guilds:
      type: array
      description: >-
        Guild IDs the bot will answer in. Empty (the default) means nobody;
        respond_to then decides which messages within an allowed guild.
      default: []
    quota_turns_per_day:
      type: number
      description: Maximum agent turns the bot will spend per user per day
      default: 50
    kiln:
      type: string
      description: >-
        Name of the `[kilns]` entry every Discord session writes to — a name,
        not a path. Required: without it a session reaches no kiln at all and
        its proposals land where `cru proposals list` never looks.
    kilns:
      type: array
      description: >-
        Names of additional `[kilns]` entries the session may read from
      default: []
    provider:
      type: string
      description: LLM provider for Discord sessions (required)
    model:
      type: string
      description: Model id for Discord sessions (required)
    agent_type:
      type: string
      description: >-
        Agent implementation to run: "internal" (the built-in agent) or "acp"
        (an external agent subprocess named by agent_name).
      default: "internal"
    system_prompt:
      type: string
      description: >-
        System prompt for Discord sessions (a Discord-shaped default applies
        when unset). Ignored when agent_card is set — the card's body is the
        prompt.
    provider_key:
      type: string
      description: Named provider credential to use instead of the default
    agent_card:
      type: string
      description: >-
        Agent card giving the internal agent its persona — prompt, model, MCP
        servers. Resolved by the daemon at session create against the
        configured kiln, so `cru agents list` names what is available. The
        access tier still decides the tool policy: it is applied over the
        card's own `tools:` block, never under it. Internal agents only —
        combine with agent_type = "acp" and session creation is refused.
    agent_name:
      type: string
      description: >-
        ACP profile to launch (claude, opencode, gemini, or an [acp.agents.*]
        profile). Requires agent_type = "acp"; on an internal agent it resolves
        nothing and is refused, because it names a profile and not a card —
        set agent_card for that.

exports:
  auto_discover: true
