name: discord
version: "0.2.0"
description: Discord integration via Gateway WebSocket and REST API
author: Crucible Team
license: MIT

main: init.lua

capabilities:
  - config
  - network
  - websocket
  - agent

config:
  properties:
    bot_token:
      type: string
      description: Discord bot token (from https://discord.com/developers)
      default: ""
    intents:
      type: number
      description: Gateway intents bitmask (default 37889 = GUILDS | GUILD_MESSAGES | DIRECT_MESSAGES | MESSAGE_CONTENT)
      default: 37889
    auto_connect:
      type: boolean
      description: Automatically connect to gateway on plugin load
      default: false
    command_prefix:
      type: string
      description: Prefix for text commands (empty = slash commands only)
      default: ""
    respond_to:
      type: string
      description: When to respond to messages
      default: "mentions"
      enum: ["mentions", "prefix", "both", "all"]
    access:
      type: object
      description: >-
        Access tier per identity, keyed "user:<id>" (DMs) or "guild:<id>", with
        an optional "default". Values are "read", "ask" or "write"; unset means
        read. "ask" prompts in the DM before each write and is refused in a
        guild, where no single account can answer for the room.
        A guild message takes the guild's tier, since everyone in a channel
        shares one session.
      default: {}
    tool_policy:
      type: object
      description: >-
        Tool name to "allow"/"ask"/"deny". Set this to replace the access tiers
        wholesale — the escape hatch for granting a tool the tiers withhold,
        such as bash on a personal bot.
      default: {}
    allowed_users:
      type: array
      description: >-
        User IDs the bot will answer in DMs. Empty (the default) means nobody —
        a DM from anyone else is ignored. respond_to does not apply to DMs.
      default: []
    allowed_guilds:
      type: array
      description: >-
        Guild IDs the bot will answer in. Empty (the default) means nobody;
        respond_to then decides which messages within an allowed guild.
      default: []
    quota_turns_per_day:
      type: number
      description: Maximum agent turns the bot will spend per user per day
      default: 50
    kiln:
      type: string
      description: >-
        Path to the kiln every Discord session writes to. Required — without it
        a session falls back to the daemon's data root and its proposals land
        where `cru proposals list` never looks.
    kilns:
      type: array
      description: Additional kiln paths the session may read from
      default: []
    provider:
      type: string
      description: LLM provider for Discord sessions (required)
    model:
      type: string
      description: Model id for Discord sessions (required)
    agent_type:
      type: string
      description: Agent implementation to run
      default: "internal"
    system_prompt:
      type: string
      description: System prompt for Discord sessions (a Discord-shaped default applies when unset)
    provider_key:
      type: string
      description: Named provider credential to use instead of the default
    agent_name:
      type: string
      description: Display name for the agent on this session

exports:
  auto_discover: true
