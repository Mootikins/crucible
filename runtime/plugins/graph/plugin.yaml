name: graph
version: "0.1.0"
description: The neighbourhood of one note, reduced on the daemon
author: Crucible Contributors
license: MIT

main: init.luau

capabilities:
  - kiln
  # `setup(cfg)` reads the `[plugins.graph]` section below.
  - config

exports:
  tools: []
  commands: []
  auto_discover: false

# Documentation of record: `PluginManifest` has no `config` field, so nothing
# parses this block. `init.luau`'s `setup(cfg)` is what applies these; the
# defaults are duplicated there because that is where resolution happens.
config:
  properties:
    depth:
      type: number
      description: >-
        Hops to walk when a caller names no depth. Clamped to 1-4: each hop is
        a full scan of the scoped link table, so an unbounded depth is an
        unbounded amount of daemon work per move of a client's control.
      default: 1
    limit:
      type: number
      description: >-
        Most notes to return before the answer is marked truncated.
      default: 200

keywords:
  - graph
  - neighbors
  - links
  - blocks
