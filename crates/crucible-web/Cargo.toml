[package]
name = "crucible-web"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Crucible web UI server — Axum routes over daemon RPC with an embedded SolidJS frontend"

[lib]
doctest = false

[features]
# Expose the mock daemon + route test helpers for integration tests.
test-utils = ["dep:tempfile", "dep:proptest", "crucible-daemon/test-utils"]

[dependencies]
# `openapi`: the wire types these two crates own describe themselves, so a
# route that forwards one does not keep a second copy of its shape.
crucible-core = { path = "../crucible-core", features = ["openapi"] }
crucible-daemon = { path = "../crucible-daemon", default-features = false, features = [
    "openapi",
] }

axum = { workspace = true, features = ["macros", "ws"] }
tower = { workspace = true }
# The OpenAPI document is generated from this router, not hand-written.
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
# `set-header`: the global security-header layer in `server.rs`.
tower-http = { version = "0.7", features = ["fs", "cors", "set-header"] }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }

# Embedded frontend (web/dist) — the default asset source in every profile;
# `--static-dir` is the opt-out.
#
# `debug-embed` is declared HERE and not merely inherited. Without it, rust-embed
# generates its `dynamic()` impl under `cfg(debug_assertions)`: `Assets::get()`
# then resolves each file at RUNTIME from the build machine's absolute `web/dist`,
# which is precisely the moved-binary-points-at-nothing defect that deleting the
# `cfg!(debug_assertions)` branch in `assets.rs` was meant to end. crucible-core
# happens to enable it and cargo unifies features, so this is free today — but
# inheriting it means one edit to another crate silently restores the old
# behaviour, and no test here would notice (the 404 body is identical either way).
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
walkdir = "2.5"
mime_guess = "2"

portable-pty = "0.9"

# `gethostname`: the machine's own name, which a wildcard bind answers to so a
# LAN browser can address it by hostname and not only by IP literal.
gethostname = "1"
# `libc`: getaddrinfo(AI_CANONNAME) for the machine's FQDN — the portable
# mechanism (RFC 3493), and the one `hostname --fqdn` uses. A bare
# /etc/hostname whose domain lives in DNS would otherwise 403 by its real name.
# Used only under cfg(unix); the crate itself builds everywhere.
libc = "0.2"

# Daemon-proxy HTTP client (transcription forwarding etc.)
reqwest = { workspace = true }
dirs = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Only compiled under `test-utils` (test_support); dev-dependencies cannot be
# referenced from library code, so they're optional real deps.
tempfile = { workspace = true, optional = true }
proptest = { version = "1.11", optional = true }
dns-lookup = "3.0.1"

# Unix-only: process-group signals for the PTY terminal teardown.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
# A real WebSocket client for the PTY route: `ServiceExt::oneshot` returns the
# 101 and never performs the upgrade, so the contract-test harness cannot reach
# the session loop the keepalive lives in.
tokio-tungstenite = { workspace = true }
# Tests only. The surface and plugin-command replies mirror vocabularies this
# crate declares (`Shape`, `Mark`, `CommandEffect`), and the round-trip tests in
# `routes/surface.rs` build a real `Surface` and hand it to the daemon's own
# projection. Already in the graph through crucible-daemon, so this costs no
# extra build.
crucible-lua = { path = "../crucible-lua", features = ["send"] }
crucible-web = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["full"] }
