[package]
name = "crucible-lua"
version.workspace = true
edition = "2021"
description = "Luau scripting runtime spike for Crucible"
license.workspace = true
authors.workspace = true

[features]
default = ["luau"]
luau = ["mlua/luau"]
send = ["mlua/send"]  # Enable Send+Sync for multi-threaded use
# Test-only `PluginManager` API. The daemon never compiles it.
test-utils = []

[dependencies]
# Runtime backend is Luau. The version tracks the workspace pin; the
# `luau` feature comes from this crate's own `luau` feature below.
mlua = { version = "0.12", features = ["vendored", "async", "serialize"] }

# Static analysis: Parse Lua for documentation extraction

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.0"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "rt", "process", "time"] }

# Shared types with core
crucible-core = { path = "../crucible-core" }

# Oil TUI framework for Lua UI building
crucible-oil = { path = "../crucible-oil", default-features = false, features = ["serde"] }

# XDG config directories
dirs = "6"

tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }

# TOON query for multi-format support
oq = { workspace = true }
# `EnumIter` over `namespace::CruNamespace` (the gated top-level `cru` set)
# and, in tests, over `handlers::hook_name` — completeness is proved by
# walking what the compiler knows rather than a second hand-written list.
strum = { version = "0.28", features = ["derive"] }
# `Checker::proves_types` writes a deliberately ill-typed file and requires
# the binary to complain about it. That probe ships, because `cru plugin check`
# must refuse a "checker" that checks nothing just as the gates do.
tempfile = { workspace = true }

[dev-dependencies]
# Tests under `tests/` drive the `PluginManager` test-only API.
crucible-lua = { path = ".", features = ["test-utils"] }
# `EnvVarGuard`, for the one test that reads `$CRUCIBLE_CONFIG_DIR` on purpose.
crucible-core = { path = "../crucible-core", features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
proptest = "1"
# `docs_lua_config` sweeps every markdown file under the two docs roots.
walkdir = "2.5"
# `docs_lua_config` needs the keys the config types do not claim: nothing in
# the config tree sets `deny_unknown_fields`, so a documented-but-invented key
# merges into the store, extracts clean, and the doc looks validated when it
# is not. The TOML gate closes the same hole the same way.
serde_ignored = "0.1"
