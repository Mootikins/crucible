[package]
name = "crucible-lua"
version.workspace = true
edition = "2021"
description = "Lua 5.4 scripting runtime for Crucible with Fennel support"
license.workspace = true
authors.workspace = true

[features]
default = ["fennel"]
# Fennel compiles Lisp to Lua - macros, pattern matching, clean syntax
fennel = ["mlua/lua54"]
send = ["mlua/send"]  # Enable Send+Sync for multi-threaded use

[dependencies]
# Runtime: Lua 5.4 with optional Fennel compiler
mlua = { version = "0.12", features = ["vendored", "async", "serialize", "lua54"] }

# Static analysis: Parse Lua for documentation extraction

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.0"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "rt", "process", "time"] }

# Shared types with core
crucible-core = { path = "../crucible-core" }

# Oil TUI framework for Lua UI building
crucible-oil = { path = "../crucible-oil", default-features = false }

# XDG config directories
dirs = "6"

tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }

# TOON query for multi-format support
oq = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `EnumIter` over `handlers::hook_name`, so the tests asserting that `ALL`
# covers every variant walk what the compiler knows rather than a second
# hand-written list. Dev-only: the derive is `#[cfg_attr(test, ...)]`.
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
proptest = "1"
