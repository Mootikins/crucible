<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- The canonical ember ramp: active → primary → hover, deep at the base. -->
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c4552e"/>
      <stop offset="55%" stop-color="#e0653a"/>
      <stop offset="100%" stop-color="#f08a5e"/>
    </linearGradient>
    <!-- Warm neutrals. A cool grey next to this much ember reads blue. -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e4df" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#928d99" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <!-- Flask body -->
  <path d="M13 4 L13 12 L6 26 Q5 28 7 29 L25 29 Q27 28 26 26 L19 12 L19 4 Z"
        fill="url(#glass)" stroke="#656069" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Liquid. Full strength: the ember is the one loud colour, and at 32px
       an opacity wash is the difference between a mark and a smudge. -->
  <path d="M9 22 L23 22 L26 26 Q27 28 25 29 L7 29 Q5 28 6 26 Z"
        fill="url(#ember)"/>
  <!-- Flask neck ring -->
  <rect x="12" y="3" width="8" height="2" rx="1" fill="#928d99" stroke="#656069" stroke-width="0.8"/>
</svg>
