# Multi-hop queries for the retrieval lab.
#
# The corpus is `docs/Help` plus `docs/Guides`, processed into one kiln.
# Every entry is a MULTI-HOP query. The question uses the words of a source
# note S. The answer is in a target note T. S links to T with a wikilink, or
# T links to S. A retrieval strategy that follows the link graph should win
# these; a strategy that scores the block vector alone should land on S.
#
# The comment above each entry names S, the wikilink, and the sentence in T
# that answers the question.
#
# `expect_note` is the stem of T; `rank_of` compares stems, so `Agent Cards`
# matches `Help/Extending/Agent Cards.md`. Stems shared by several notes
# (`Index`, `Configuration`, `acp`, `Canvas`) are never used. `lenient = true`
# marks a query a third note also answers defensibly: counted for recall@k,
# excluded from strict hit rate. No entry carries `expect_text`; the eval
# scores these at note rank only.
#
# No question repeats a transition or control question from
# `assets/fixtures/transition_queries/golden.toml`.

top_k = 10

# =============================================================================
# Multi-hop queries (30)
# =============================================================================

# S: Help/Block References.md — [[Help/Wikilinks]]
#   T: Help/Wikilinks.md — "The heading reference is captured on the parsed link; no heading-scoped content is embedded."
#   lenient: Block References itself says an embed renders as a plain link.
[[queries]]
question = "the embed prefix parses but there is no transclusion, so what does an embed with a heading reference like ![[Note Name#Heading]] actually embed?"
expect_note = "Wikilinks"
lenient = true

