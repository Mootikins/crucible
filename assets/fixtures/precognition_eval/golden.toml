# Golden queries for precognition retrieval eval.
#
# One entry per (question, note that should surface). `lenient = true` marks
# defensible-but-not-unambiguous matches: counted for recall@k, excluded from
# strict hit rate. Every query names why the expected note should win.

top_k = 10

[[queries]]
question = "how do I stay productive working from my apartment?"
expect_note = "work-from-home-tips"

[[queries]]
question = "I keep getting distracted, how do I concentrate better?"
expect_note = "focus-strategies"
lenient = true

[[queries]]
question = "should I have my camera on for the standup call?"
expect_note = "remote-meeting-etiquette"

[[queries]]
question = "is it rude to reply to Slack tomorrow instead of now?"
