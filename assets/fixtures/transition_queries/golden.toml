# Transition queries for the retrieval lab.
#
# The corpus is `docs/Help` plus `docs/Guides`, processed into one kiln.
# Two kinds of entry share this file:
#
# - A TRANSITION query. Its answer is the passage where a note moves from
#   one topic to the next: the last block of one section and the first block
#   of the following section. A retrieval strategy that scores the trajectory
#   between adjacent block vectors should win these. The comment above each
#   entry names the note path and the two adjacent blocks it expects, by
#   heading and first words.
# - A CONTROL query. Its answer is one block. A trajectory strategy must not
#   lose these to the block-point baseline.
#
# `expect_note` is the note's filename stem; `rank_of` compares stems, so
# `Semantic Search` matches `Help/Concepts/Semantic Search.md`. Stems shared by
# several notes (`Index`) are never used. `lenient = true` marks a query a
# second note also answers defensibly: counted for recall@k, excluded from
# strict hit rate. `expect_text` names the two expected blocks by a phrase
# each one holds, whitespace collapsed; the eval finds the block whose source
# holds the phrase and scores the hit rows at block granularity beside the
# note rank.
#
# Every query is written as a user would type it, not in the note's words.

top_k = 10

