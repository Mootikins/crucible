# =============================================================================
# Crucible Reference Configuration
# =============================================================================
# Location: docs/Config.toml
#
# This is a reference for the format of Crucible's config file. Copy the parts
# you need into your own config; this file is documentation, not a config the
# tool loads.
#
# Where the real config lives:
#   Linux    ~/.config/crucible/config.toml
#   macOS    ~/Library/Application Support/crucible/config.toml
#   Windows  %APPDATA%\crucible\config.toml
#
# Override the path with `cru -C <path>` or $CRUCIBLE_CONFIG; override the
# directory with $CRUCIBLE_CONFIG_DIR.
#
# A kiln's own `.crucible/kiln.toml` holds only the kiln's display name
# (`[kiln] name = "..."`). None of the sections below are read from it.
# `.crucible/project.toml` holds project metadata and security policy.
#
# Environment variables Crucible reads:
#   CRUCIBLE_CONFIG      - path to this file
#   CRUCIBLE_CONFIG_DIR  - directory containing config.toml
#   CRUCIBLE_KILN        - kiln path, when no --kiln flag and no ancestor
#                          .crucible/ directory is found
#   CRUCIBLE_HOME        - daemon data root (default ~/.crucible)
#   CRUCIBLE_SOCKET      - daemon socket path
#   CRUCIBLE_RUNTIME     - runtime root (plugins, themes, skills)
#   CRUCIBLE_PLUGIN_PATH - extra plugin search paths
#   CRUCIBLE_LOG_FILE    - log file path
#
# String values may reference an environment variable as {env:VAR_NAME}, a file's
# contents as {file:~/.secrets/key.txt}, or a directory as {dir:~/conf.d}.
#
# Priority (highest to lowest):
#   1. CLI flags (--embedding-url, --embedding-model, …)
#   2. This config file
#   3. Defaults
#
# Sections marked "reserved" parse but are not yet wired to behaviour.
# =============================================================================

# =============================================================================
# Kiln registry
# =============================================================================
# `[kilns]` maps a name to a path, or to a table with options. When it is
# present, the legacy top-level `kiln_path` is ignored.

default_kiln = "docs"

[kilns]
docs = "."

# Full form, with options:
# [kilns.work]
# path = "~/work/notes"
# lazy = true          # not opened at daemon start

# Legacy single-kiln shorthand, still honoured when [kilns] is empty:
# kiln_path = "~/notes"

# Where `cru chat` stores sessions, if not the default kiln:
# session_kiln = "~/sessions"

# Daemon data root (project registry, default session storage, home kiln).
# Defaults to $CRUCIBLE_HOME, else ~/.crucible.
# data_home = "~/.crucible"

# Extra directories to search for agent cards, beyond the built-in locations.
# agent_directories = ["~/shared-agents"]

# Extra directories to search for plugins and themes. This is the list of
# *additional* roots; the well-known ones always apply.
# runtimepath = ["/opt/crucible/runtime"]

# =============================================================================
# [projects.*] - Project registry
# =============================================================================
# Bind a code repository to one or more kilns. The daemon auto-opens a
# project's kilns when a session starts inside it. `cru init` writes these.

# [projects.crucible]
# path = "~/crucible"
# kilns = ["docs"]
# default_kiln = "docs"

# =============================================================================
# [llm] - LLM providers
# =============================================================================
# Named provider instances. `default` names the key used for chat.
# See Help/Config/llm.md.

[llm]
default = "local"

[llm.providers.local]
type = "ollama"
endpoint = "http://localhost:11434"
default_model = "llama3.2"
temperature = 0.7
max_tokens = 4096
timeout_secs = 120

# [llm.providers.cloud]
# type = "openai"
# default_model = "gpt-4o"
# api_key = "{env:OPENAI_API_KEY}"

# [llm.providers.claude]
# type = "anthropic"
# default_model = "claude-3-5-sonnet-20241022"
# api_key = "{env:ANTHROPIC_API_KEY}"

# Specialty -> model mapping for agent cards that declare `specialty:`.
# [llm.models]
# reasoning = "openai/o1"
# coder = "qwen2.5-coder"

# =============================================================================
# [enrichment] - Embeddings and the enrichment pipeline
# =============================================================================
# Without this section the daemon SKIPS embedding generation entirely and
# semantic search returns nothing.
#
# The older flat `[embedding]` section is REJECTED — a config containing it
# fails to load. See Help/Config/embedding.md for every provider's fields.

[enrichment.provider]
type = "fastembed"                    # fastembed | ollama | openai | cohere |
                                      # vertexai | burn | custom | mock
model = "BAAI/bge-small-en-v1.5"
batch_size = 32
dimensions = 384

# Pipeline tuning. Optional; every key below shows its default.
[enrichment.pipeline]
# worker_count = 8                    # default: num_cpus
# batch_size = 16
# max_queue_size = 1000
# timeout_ms = 30000
# retry_attempts = 3
# retry_delay_ms = 1000
# circuit_breaker_threshold = 5
# circuit_breaker_timeout_ms = 60000
# max_precognition_chars = 3000

# =============================================================================
# [chat] - Chat defaults
# =============================================================================
# Defaults for Crucible's own agent. The provider is chosen under [llm], not
# here — a `provider` key in this section is REJECTED.

[chat]
enable_markdown = true
show_thinking = false
show_diffs = true
agent_preference = "crucible"         # "crucible" (default) or "acp"
# model = "llama3.2"
# endpoint = "http://localhost:11434"
# temperature = 0.7
# max_tokens = 2048
# timeout_secs = 120

# =============================================================================
# [acp] - External agents over the Agent Client Protocol
# =============================================================================
# See Help/Config/acp.md for every field, including agent profiles,
# delegation, and per-agent permissions.

[acp]
enable_discovery = true
session_timeout_minutes = 30
max_message_size_mb = 25
streaming_timeout_minutes = 15
lazy_agent_selection = true
# default_agent = "claude"            # omit to auto-discover

# [acp.agents.my-claude]
# extends = "claude"
# env = { ANTHROPIC_BASE_URL = "http://localhost:4000" }

# =============================================================================
# [cli] - CLI behaviour
# =============================================================================

[cli]
show_progress = true
confirm_destructive = true
verbose = false

# [cli.highlighting]
# enabled = true

# =============================================================================
# [context] - Project rules files
# =============================================================================
# Files searched from git root down to the workspace directory and loaded
# hierarchically. See Help/Rules Files.md.

# [context]
# rules_files = ["AGENTS.md", "CLAUDE.md", ".rules", ".github/copilot-instructions.md"]

# =============================================================================
# [storage] - Daemon storage
# =============================================================================
# SQLite lives at <kiln>/.crucible/crucible-sqlite.db, the vector index at
# <kiln>/.crucible/crucible-vectors.lance/. Old `storage.mode` values are
# accepted and ignored.

# [storage]
# idle_timeout_secs = 300

# =============================================================================
# [permissions] - Tool access control
# =============================================================================
# See Help/Config/permissions.md for pattern syntax.

# [permissions]
# default = "ask"                     # allow | deny | ask
# allow = ["read_note:*", "semantic_search:*"]
# deny = ["bash:rm *"]
# ask = ["write_file:*"]

# =============================================================================
# [mcp] - Upstream MCP servers
# =============================================================================
# Aggregate an external MCP server's tools under a prefix.
# See Help/Config/mcp.md.

# [[mcp.servers]]
# name = "github"
# prefix = "gh_"
# auto_reconnect = true
# timeout_secs = 30
# allowed_tools = ["search_*", "get_*"]
# blocked_tools = ["delete_*"]
#
# [mcp.servers.transport]
# type = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
#
# [mcp.servers.transport.env]
# GITHUB_TOKEN = "{env:GITHUB_TOKEN}"

# =============================================================================
# [web] - Browser UI
# =============================================================================
# See Help/Config/web.md.
#
# `registration_roots` and `allowed_hosts` are FAIL-CLOSED and empty by
# default, and neither has a command-line override:
#
#   registration_roots  Directories the web UI's "add project" button may
#                       create a NEW project root under. Empty ([]) refuses
#                       every new root — the button 403s. A project root is
#                       also a read scope for /api/file/raw, so new roots are
#                       opt-in. The other path is to run `cru` inside the
#                       directory; anything under an already-registered
#                       project needs no configuration at all.
#
#   allowed_hosts       Extra Host authorities this server answers to, on top
#                       of localhost/127.0.0.1/[::1] on `port` and whatever
#                       `host` names. Empty ([]) means "derive from the bind
#                       address", NOT "allow anything" — so reaching the box
#                       by an mDNS name (impulse.local) or through a reverse
#                       proxy is a 403 until the name is listed here. An entry
#                       without a port matches both bare and on `port`; an
#                       entry with a port matches that port only. No globs.
#
# Webhook sender secrets are NOT in this file. POST /api/webhook/{name}
# requires an HMAC signature and is closed until you create
# ~/.config/crucible/webhooks.toml with `[webhooks.<name>] secret = "..."`.
# See Help/Config/web.md § Webhooks.
#
# Two more web controls have no config key at all:
#   CRUCIBLE_WEB_ALLOW_LOOPBACK_ENDPOINTS=1   env var on the `cru web` process.
#       A session endpoint pointing at the server's own loopback (a local
#       Ollama on http://localhost:11434) is allowed when `host` is a loopback
#       bind — 127.x, ::1 or "localhost" — and refused as SSRF otherwise.
#       This variable force-allows it on a LAN/wildcard bind too; it only ever
#       adds permission, and unlocks loopback only.
#   CRUCIBLE_CORS_ORIGINS                     comma-separated extra CORS origins.

# [web]
# port = 3000
# host = "127.0.0.1"
# api_key = ""                        # "" disables auth entirely
# remote_shell = false
# registration_roots = []             # e.g. ["~/Projects"]
# allowed_hosts = []                  # e.g. ["impulse.local", "crucible.example.com"]

# =============================================================================
# [scm] - Git integration
# =============================================================================

# [scm]
# enabled = true
# detect_worktrees = false
# projects_dir = "~/Projects"
# session_workspace_dir = "~/.crucible/workspaces"

# =============================================================================
# [server] - Daemon server settings
# =============================================================================
# `auto_archive_hours` is live. The TLS and request-limit fields (https,
# cert_file, key_file, max_body_size, timeout_seconds) are reserved and are
# not yet wired to behaviour.

# [server]
# auto_archive_hours = 72

# =============================================================================
# [logging]
# =============================================================================

# [logging]
# level = "info"                      # off | error | warn | info | debug | trace
# format = "text"                     # text | json | compact
# console = true
# file = false
# file_path = "~/.local/share/crucible/crucible.log"
#
# [logging.component_levels]
# crucible_core = "debug"

# =============================================================================
# [[schedules]] - Recurring Lua snippets
# =============================================================================

# [[schedules]]
# name = "nightly reindex"
# every = "1d"                        # "1d", "1h", "30m", "5s", or bare seconds
# action = "lua:cru.log('tick')"
# enabled = true

# =============================================================================
# [plugins.*] - Per-plugin settings
# =============================================================================
# Free-form tables read by the plugin of the same name.

# [plugins.oci]
# runtime = "podman"
